[package]
name = "lncvrt-games-launcher"
version = "1.10.0"
authors = ["Lncvrt"]
edition = "2024"

[lib]
name = "lncvrt_games_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-os = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = [
  "stream",
  "rustls",
] }
tokio = "1.53.1"
futures-util = { version = "0.3.34", features = ["io"] }
tauri-plugin-fs = "2.6.0"
zip = "8.6.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-notification = "2.5.0"
sha2 = "0.11.0"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-prevent-default = "6.0.0"
base64 = "0.23.1"
tauri-plugin-http = "2.8.0"
dashmap = "6.2.1"
tauri-plugin-store = "2.5.0"
hex = "0.4.3"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
pem = "4.0.0"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
sysinfo = "0.39.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-cli = "2.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-decorum = "1.1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
